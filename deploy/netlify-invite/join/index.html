<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090e12">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="referrer" content="no-referrer">
    <title>Open invite in XMO</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #090e12;
        color: #f7f8f8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background: #090e12;
      }
      main { width: min(100%, 440px); }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: 21px;
        font-weight: 800;
        margin-bottom: 38px;
      }
      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #171d22;
        color: #93eb2d;
        font-size: 17px;
      }
      .identity {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 22px;
      }
      .avatar {
        width: 78px;
        height: 78px;
        flex: 0 0 78px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #252b31;
        color: #93eb2d;
        font-size: 28px;
        font-weight: 800;
        overflow: hidden;
      }
      .avatar img { width: 100%; height: 100%; object-fit: cover; }
      .identity-copy { min-width: 0; text-align: left; }
      .type {
        margin: 0 0 6px;
        color: #93eb2d;
        font-size: 12px;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: 28px; line-height: 1.2; overflow-wrap: anywhere; }
      .meta { margin: 7px 0 0; color: #a6abb0; font-size: 15px; }
      .topic { margin: 0 0 22px; color: #d1d4d6; line-height: 1.5; }
      .notice {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin: 0;
        padding: 14px 0;
        border-top: 1px solid #242b31;
        border-bottom: 1px solid #242b31;
        text-align: left;
        color: #b9bec2;
        line-height: 1.45;
      }
      .notice-icon {
        flex: 0 0 auto;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #20272d;
        color: #93eb2d;
        font-weight: 800;
      }
      .actions { display: grid; gap: 10px; margin-top: 24px; }
      .button {
        min-height: 52px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        padding: 0 22px;
        color: #090e12;
        background: #ffffff;
        text-decoration: none;
        font-weight: 750;
      }
      .button.secondary {
        min-height: 44px;
        color: #d7dadd;
        background: transparent;
      }
      .status { color: #a6abb0; line-height: 1.5; text-align: center; }
      .error { color: #ff8f98; }
      [hidden] { display: none !important; }
      @media (max-width: 480px) {
        body { place-items: start center; padding-top: 36px; }
        .brand { margin-bottom: 44px; }
        .avatar { width: 68px; height: 68px; flex-basis: 68px; }
        h1 { font-size: 25px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><span class="brand-mark">X</span><span>XMO</span></div>
      <section id="loading" class="status" aria-live="polite">Checking invite...</section>
      <section id="invite" hidden>
        <div class="identity">
          <div id="avatar" class="avatar" aria-hidden="true">X</div>
          <div class="identity-copy">
            <p id="type" class="type"></p>
            <h1 id="name"></h1>
            <p id="meta" class="meta"></p>
          </div>
        </div>
        <p id="topic" class="topic" hidden></p>
        <div class="notice">
          <span class="notice-icon" aria-hidden="true">✓</span>
          <span id="notice"></span>
        </div>
        <div class="actions">
          <a id="open" class="button" href="#" rel="noreferrer">Open XMO</a>
          <a class="button secondary" rel="noreferrer" href="https://xmoappreleases2026.blob.core.windows.net/app-releases/xmo-latest.apk">Download XMO</a>
        </div>
      </section>
      <section id="error" class="status error" hidden>
        This invite is invalid, expired, or has been disabled.
      </section>
    </main>
    <script>
      (() => {
        const apiBase = "https://xmo-matrix.centralindia.cloudapp.azure.com/auth/otp";
        const token = location.pathname.split("/").filter(Boolean)[1] || "";
        const validToken = /^[A-Za-z0-9_-]{40,64}$/.test(token);
        const loading = document.getElementById("loading");
        const invite = document.getElementById("invite");
        const error = document.getElementById("error");

        const fail = () => {
          loading.hidden = true;
          invite.hidden = true;
          error.hidden = false;
        };

        if (!validToken) {
          fail();
          return;
        }

        fetch(`${apiBase}/invites/${encodeURIComponent(token)}/preview`, {
          headers: { Accept: "application/json" },
          cache: "no-store",
        })
          .then(async (response) => {
            if (!response.ok) throw new Error("Invite unavailable");
            const payload = await response.json();
            if (!payload.success || !payload.invite) throw new Error("Invalid invite");
            return payload.invite;
          })
          .then((data) => {
            if (!["group", "channel"].includes(data.type) ||
                !["join", "knock"].includes(data.joinMode)) {
              throw new Error("Invalid invite metadata");
            }
            const name = String(data.name || "XMO invite").trim();
            const memberCount = Math.max(0, Number(data.memberCount) || 0);
            const typeLabel = data.type === "channel" ? "Channel" : "Group";
            document.title = `${name} | XMO`;
            document.getElementById("name").textContent = name;
            document.getElementById("type").textContent = `${typeLabel} invite`;
            document.getElementById("meta").textContent = `${memberCount} ${memberCount === 1 ? "member" : "members"}`;
            const avatar = document.getElementById("avatar");
            avatar.textContent = name.charAt(0).toUpperCase() || "X";
            if (String(data.avatarUrl || "").startsWith("mxc://")) {
              const image = document.createElement("img");
              image.alt = "";
              image.referrerPolicy = "no-referrer";
              image.src = `${apiBase}/invites/${encodeURIComponent(token)}/avatar`;
              image.addEventListener("error", () => image.remove());
              avatar.appendChild(image);
            }
            const topic = String(data.topic || "").trim();
            if (topic) {
              const topicNode = document.getElementById("topic");
              topicNode.textContent = topic;
              topicNode.hidden = false;
            }
            document.getElementById("notice").textContent = data.joinMode === "knock"
              ? `Open XMO to review this ${typeLabel.toLowerCase()} and request to join.`
              : `Open XMO to review and join this ${typeLabel.toLowerCase()}.`;
            document.getElementById("open").href = `xmo://join/${encodeURIComponent(token)}`;
            loading.hidden = true;
            invite.hidden = false;
          })
          .catch(fail);
      })();
    </script>
  </body>
</html>
