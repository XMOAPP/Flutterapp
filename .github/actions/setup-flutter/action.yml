name: Set up verified Flutter
description: Downloads a checksum-verified Flutter SDK for Linux runners.

inputs:
  flutter-version:
    description: Exact Flutter SDK version to install.
    required: true
  channel:
    description: Flutter release channel.
    required: true
  sha256:
    description: SHA-256 checksum from Flutter's official release manifest.
    required: true

runs:
  using: composite
  steps:
    - name: Download and verify Flutter SDK
      shell: bash
      env:
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
        FLUTTER_CHANNEL: ${{ inputs.channel }}
        FLUTTER_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        archive="${RUNNER_TEMP}/flutter_linux_${FLUTTER_VERSION}-${FLUTTER_CHANNEL}.tar.xz"
        install_root="${RUNNER_TEMP}/xmo-flutter-sdk"
        url="https://storage.googleapis.com/flutter_infra_release/releases/${FLUTTER_CHANNEL}/linux/flutter_linux_${FLUTTER_VERSION}-${FLUTTER_CHANNEL}.tar.xz"

        curl --fail --location --retry 3 --silent --show-error "$url" --output "$archive"
        echo "${FLUTTER_SHA256}  ${archive}" | sha256sum --check --status
        mkdir -p "$install_root"
        tar --extract --xz --file "$archive" --directory "$install_root"
        echo "${install_root}/flutter/bin" >> "$GITHUB_PATH"
        echo "FLUTTER_ROOT=${install_root}/flutter" >> "$GITHUB_ENV"
