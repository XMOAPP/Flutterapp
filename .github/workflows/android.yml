name: Android CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      run_android_integration:
        description: Run the deterministic Android emulator smoke test
        required: false
        type: boolean
        default: false
      build_release:
        description: Build and retain the signed production AAB
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: xmo-android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.7
  JAVA_VERSION: "17"
  DART_DISABLE_ANALYTICS: "true"

jobs:
  quality:
    name: Flutter format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          sha256: f344d5057db52abc2a63cd3a7c7370957b7685d1fca5e5fbe2ce4dfe74657a79
      - name: Create log directory
        run: mkdir -p build/quality-logs
      - name: Check changed-file whitespace
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          else
            previous_commit="$(git rev-parse HEAD^ 2>/dev/null || true)"
            if [[ -n "$previous_commit" ]]; then
              git diff --check "$previous_commit...HEAD"
            fi
          fi
      - name: Resolve Flutter dependencies
        run: bash tools/ci/run_with_timeout.sh 300 build/quality-logs/flutter-pub-get.log flutter pub get
      - name: Check Flutter formatting
        run: bash tools/ci/run_with_timeout.sh 180 build/quality-logs/flutter-format.log dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze Flutter source
        run: bash tools/ci/run_with_timeout.sh 420 build/quality-logs/flutter-analyze.log flutter analyze --no-pub --no-fatal-infos
      - name: Run Flutter tests
        run: bash tools/ci/run_with_timeout.sh 600 build/quality-logs/flutter-test.log flutter test --no-pub --reporter expanded
      - name: Redact retained logs
        if: always()
        run: bash tools/ci/redact_logs.sh build/quality-logs/*.log
      - name: Upload Flutter quality logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: flutter-quality-logs
          path: build/quality-logs
          if-no-files-found: warn
          retention-days: 14

  backend:
    name: Auth server format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          sha256: f344d5057db52abc2a63cd3a7c7370957b7685d1fca5e5fbe2ce4dfe74657a79
      - name: Create log directory
        run: mkdir -p build/quality-logs
      - name: Resolve auth server dependencies
        working-directory: auth_server
        run: bash ../tools/ci/run_with_timeout.sh 300 ../build/quality-logs/auth-pub-get.log dart pub get
      - name: Check auth server formatting
        working-directory: auth_server
        run: bash ../tools/ci/run_with_timeout.sh 180 ../build/quality-logs/auth-format.log dart format --output=none --set-exit-if-changed bin lib test
      - name: Analyze auth server
        working-directory: auth_server
        run: |
          DART_BIN="$(dirname "$(which flutter)")/cache/dart-sdk/bin/dart"
          bash ../tools/ci/run_with_timeout.sh 420 ../build/quality-logs/auth-analyze.log "$DART_BIN" analyze
      - name: Test auth server
        working-directory: auth_server
        run: |
          DART_BIN="$(dirname "$(which flutter)")/cache/dart-sdk/bin/dart"
          bash ../tools/ci/run_with_timeout.sh 600 ../build/quality-logs/auth-test.log "$DART_BIN" test --reporter expanded
      - name: Redact retained logs
        if: always()
        run: bash tools/ci/redact_logs.sh build/quality-logs/*.log
      - name: Upload auth server quality logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auth-server-quality-logs
          path: build/quality-logs
          if-no-files-found: warn
          retention-days: 14

  android-integration:
    name: Android emulator smoke
    needs: [quality, backend]
    if: github.event_name == 'workflow_dispatch' && inputs.run_android_integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          sha256: f344d5057db52abc2a63cd3a7c7370957b7685d1fca5e5fbe2ce4dfe74657a79
      - name: Reclaim runner disk for Android build
        run: bash tools/ci/free_android_runner_disk.sh
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false
      - name: Create log directory
        run: mkdir -p build/quality-logs
      - name: Resolve Flutter dependencies
        run: bash tools/ci/run_with_timeout.sh 300 build/quality-logs/integration-pub-get.log flutter pub get
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Create and start emulator
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          bash tools/ci/run_with_timeout.sh 600 build/quality-logs/emulator-setup.log sdkmanager "platform-tools" "platforms;android-35" "system-images;android-35;google_apis;x86_64" "emulator"
          test -x "$SDK_ROOT/emulator/emulator"
          echo no | avdmanager create avd --force --name xmo_ci --package "system-images;android-35;google_apis;x86_64"
          "$SDK_ROOT/emulator/emulator" -list-avds | grep -Fx xmo_ci
          nohup "$SDK_ROOT/emulator/emulator" -avd xmo_ci -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > build/quality-logs/emulator.log 2>&1 &
          bash tools/ci/run_with_timeout.sh 600 build/quality-logs/emulator-boot.log adb wait-for-device
          timeout 600 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'
          adb shell input keyevent 82
          available_kb="$(df --output=avail / | tail -n 1 | tr -d ' ')"
          test "$available_kb" -ge 6291456
          df -h /
      - name: Run deterministic Android smoke test
        run: >-
          bash tools/ci/run_with_timeout.sh 900 build/quality-logs/android-smoke.log
          flutter test integration_test/chat_input_smoke_test.dart -d emulator-5554
          --dart-define=XMO_HOMESERVER_URL=https://xmo-matrix.centralindia.cloudapp.azure.com
          --dart-define=XMO_MATRIX_SERVER_NAME=xmo-matrix.centralindia.cloudapp.azure.com
      - name: Redact retained logs
        if: always()
        run: bash tools/ci/redact_logs.sh build/quality-logs/*.log
      - name: Stop emulator
        if: always()
        run: adb emu kill || true
      - name: Upload Android smoke logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-integration-logs
          path: build/quality-logs
          if-no-files-found: warn
          retention-days: 14

  release-bundle:
    name: Signed production app bundle
    needs: [quality, backend]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.build_release)
    environment: production-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          sha256: f344d5057db52abc2a63cd3a7c7370957b7685d1fca5e5fbe2ce4dfe74657a79
      - name: Create log directory
        run: mkdir -p build/quality-logs
      - name: Resolve Flutter dependencies
        run: bash tools/ci/run_with_timeout.sh 300 build/quality-logs/release-pub-get.log flutter pub get
      - name: Configure signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Build release bundle
        env:
          XMO_HOMESERVER_URL: ${{ vars.XMO_HOMESERVER_URL }}
          XMO_MATRIX_SERVER_NAME: ${{ vars.XMO_MATRIX_SERVER_NAME }}
          XMO_WALLET_AUTH_SERVER_URL: ${{ vars.XMO_WALLET_AUTH_SERVER_URL }}
          XMO_STREAM_CHUNK_STORAGE: ${{ vars.XMO_STREAM_CHUNK_STORAGE }}
          XMO_AZURE_CHUNK_SIGN_URL: ${{ vars.XMO_AZURE_CHUNK_SIGN_URL }}
          XMO_ACCOUNT_DELETION_SERVER_URL: ${{ vars.XMO_ACCOUNT_DELETION_SERVER_URL }}
          XMO_ACCOUNT_DELETION_WEB_URL: ${{ vars.XMO_ACCOUNT_DELETION_WEB_URL }}
          XMO_INVITE_SERVER_URL: ${{ vars.XMO_INVITE_SERVER_URL }}
          XMO_INVITE_WEB_BASE_URL: ${{ vars.XMO_INVITE_WEB_BASE_URL }}
          XMO_SSO_IDP_ID: ${{ vars.XMO_SSO_IDP_ID }}
          XMO_MFA_SETUP_URL: ${{ vars.XMO_MFA_SETUP_URL }}
        run: |
          set -euo pipefail
          for variable in \
            XMO_HOMESERVER_URL \
            XMO_MATRIX_SERVER_NAME \
            XMO_WALLET_AUTH_SERVER_URL \
            XMO_STREAM_CHUNK_STORAGE \
            XMO_AZURE_CHUNK_SIGN_URL \
            XMO_ACCOUNT_DELETION_SERVER_URL \
            XMO_ACCOUNT_DELETION_WEB_URL \
            XMO_INVITE_SERVER_URL \
            XMO_INVITE_WEB_BASE_URL \
            XMO_SSO_IDP_ID \
            XMO_MFA_SETUP_URL; do
            test -n "${!variable}"
          done
          bash tools/ci/run_with_timeout.sh 1800 build/quality-logs/release-build.log \
            flutter build appbundle --release \
            --dart-define=XMO_HOMESERVER_URL="$XMO_HOMESERVER_URL" \
            --dart-define=XMO_MATRIX_SERVER_NAME="$XMO_MATRIX_SERVER_NAME" \
            --dart-define=XMO_WALLET_AUTH_SERVER_URL="$XMO_WALLET_AUTH_SERVER_URL" \
            --dart-define=XMO_STREAM_CHUNK_STORAGE="$XMO_STREAM_CHUNK_STORAGE" \
            --dart-define=XMO_AZURE_CHUNK_SIGN_URL="$XMO_AZURE_CHUNK_SIGN_URL" \
            --dart-define=XMO_ACCOUNT_DELETION_SERVER_URL="$XMO_ACCOUNT_DELETION_SERVER_URL" \
            --dart-define=XMO_ACCOUNT_DELETION_WEB_URL="$XMO_ACCOUNT_DELETION_WEB_URL" \
            --dart-define=XMO_INVITE_SERVER_URL="$XMO_INVITE_SERVER_URL" \
            --dart-define=XMO_INVITE_WEB_BASE_URL="$XMO_INVITE_WEB_BASE_URL" \
            --dart-define=XMO_ENABLE_SSO_LOGIN=true \
            --dart-define=XMO_OIDC_ONLY_AUTHENTICATION=true \
            --dart-define=XMO_SSO_IDP_ID="$XMO_SSO_IDP_ID" \
            --dart-define=XMO_SSO_CALLBACK_URL=https://xmo.dpdns.org/auth/callback \
            --dart-define=XMO_MFA_SETUP_URL="$XMO_MFA_SETUP_URL"
      - name: Verify Vodozemac and 16 KB artifact compatibility
        run: |
          set -euo pipefail
          BUNDLETOOL_VERSION=1.17.2
          BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
          curl --fail --location --retry 3 \
            --output "$BUNDLETOOL_JAR" \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar"
          pwsh -NoProfile -File tools/verify_android_16kb.ps1 \
            -BundletoolJar "$BUNDLETOOL_JAR"
          pwsh -NoProfile -File tools/verify_no_legacy_olm.ps1 \
            -CheckDependencies -RequireRustCrypto
      - name: Redact retained logs
        if: always()
        run: bash tools/ci/redact_logs.sh build/quality-logs/*.log
      - name: Remove signing material
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties
      - name: Upload release logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-logs
          path: build/quality-logs
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xmo-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
